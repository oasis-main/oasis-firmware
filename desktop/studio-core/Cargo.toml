[package]
name = "oasis-studio-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Oasis Studio tool registry: the functions behind the desktop app and the MCP server"
rust-version = "1.77"

[lib]
name = "oasis_studio_core"
path = "src/lib.rs"

# MCP (Model Context Protocol) server over stdio. Same tools as the app.
[[bin]]
name = "oasis-studio-mcp"
path = "src/bin/oasis-studio-mcp.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
serialport = "4"
which = "6"
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
oasis-core = { path = "../.." }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["term"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
