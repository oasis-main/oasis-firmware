[package]
name = "oasis-studio"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Oasis Studio: design, simulate, flash, and command hobby hardware"
rust-version = "1.77"

[lib]
name = "oasis_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
# The tool registry. The MCP server (oasis-studio-mcp) uses the same crate.
oasis-studio-core = { path = "../studio-core" }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
